apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cybersentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cybersentinel-frontend:latest
          ports:
            - containerPort: 8501
          env:
            - name: BACKEND_URL
              value: http://backend-service:80
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
