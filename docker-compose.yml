version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersentinel-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./cybersentinel.db
      SECRET_KEY: development-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - .:/app
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cybersentinel-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: cybersentinel-postgres
    environment:
      POSTGRES_DB: cybersentinel
      POSTGRES_USER: cybersentinel
      POSTGRES_PASSWORD: cybersentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
